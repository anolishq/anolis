name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter lists a pull request's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      native: ${{ steps.filter.outputs.native }}
      cpp: ${{ steps.cppfilter.outputs.cpp }}
      docs: ${{ steps.docsfilter.outputs.docs }}
      observability: ${{ steps.obsfilter.outputs.observability }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.svg'
              - '!**/*.jpg'
              - '!**/*.jpeg'
              - '!**/*.gif'
            # What the runtime build and its tests can see: code, minus the shell
            # installer and the observability stack, which have their own lanes
            # and nothing in CMake or CTest reads. Keep in step with the
            # paths-ignore lists in extended.yml and hardening.yml.
            native:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.svg'
              - '!**/*.jpg'
              - '!**/*.jpeg'
              - '!**/*.gif'
              - '!tools/**'
              - '!tests/shell/**'
              - '!observability/**'
              - '!tests/observability/**'
      # Separate OR-filter (default quantifier) for the C++ sources the clang-tidy
      # gate lints, so it skips (and the ok gate stays green) on non-C++ PRs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: cppfilter
        with:
          filters: |
            cpp:
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '.clang-tidy'
      # The files the docs-check workflow lints, and the schemas it validates the
      # docs' config blocks against, so the docs gate skips (and ok stays green)
      # on PRs that touch none of them.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: docsfilter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - '.markdownlint.jsonc'
              - '.github/workflows/ci.yml'
              - 'doc-schemas.json'
              - 'schemas/**'
      # What the dashboard query suite exercises: the dashboards and their
      # provisioning, the suite, and the sink whose rows it mirrors.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: obsfilter
        with:
          filters: |
            observability:
              - 'observability/**'
              - 'tests/observability/**'
              - 'tools/process-dashboard/**'
              - 'core/telemetry/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  docs:
    name: Docs
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    uses: anolishq/.github/.github/workflows/docs-check.yml@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2

  format-check:
    name: C++ Formatting (clang-format)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned clang-tools
        # SHA-verified static LLVM 18.1.8 clang-format on PATH — the org source of
        # truth; install the same pinned binary on dev boxes to match CI. See
        # anolishq/.github#69.
        uses: anolishq/.github/.github/actions/setup-clang-tools@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # setup-clang-tools
      - name: Check formatting
        run: git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs clang-format --dry-run --Werror

  python-lint:
    name: Python Linting (ruff)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff checks
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

  python-typecheck:
    name: Python Type Checking (mypy)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run mypy .

  shell-tests:
    name: Shell Lint & Smoke Tests (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # arm64 is the Pi deployment arch. arch_test.bats exercises install.sh's
        # uname -m mapping natively on each leg, so the arm64 leg proves the
        # aarch64->arm64 branch on real Pi-class hardware. See anolishq/.github#104.
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: ShellCheck
        # shellcheck is static analysis (arch-independent) — run it once, on x64.
        if: matrix.os == 'ubuntu-24.04'
        run: shellcheck tools/install.sh tools/release-sha256sums.sh

      - name: BATS smoke tests
        run: bats tests/shell/

  observability:
    name: Observability (dashboard queries)
    needs: [changes]
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The dev stack's image pins, with the test override from tests/observability/.
      COMPOSE: >-
        docker compose -p anolis-obs-test
        --env-file tests/observability/compose.test.env
        -f observability/docker-compose.observability.yml
        -f tests/observability/compose.test.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start InfluxDB and Grafana
        run: $COMPOSE up -d --wait --quiet-pull

      - name: Run the dashboard query suite
        run: $COMPOSE run --rm tester

      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  ui-contracts:
    name: UI and Runtime Contracts
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Validate runtime HTTP OpenAPI contract (structural)
        run: uv run python tests/contracts/runtime-http/validate-runtime-http-openapi.py

      - name: Validate runtime HTTP OpenAPI contract (examples)
        run: uv run python tests/contracts/runtime-http/validate-runtime-http-examples.py

      - name: Validate machine profile contract
        run: uv run python tests/contracts/machine-profile/validate-machine-profiles.py

      - name: Validate telemetry timeseries contract
        run: uv run python tests/contracts/telemetry-timeseries/validate-telemetry-timeseries.py

      - name: Validate telemetry health timeseries contract
        run: uv run python tests/contracts/telemetry-timeseries/validate-telemetry-timeseries.py --manifest tests/contracts/telemetry-health-timeseries/examples/manifest.yaml

  core-build-test:
    name: ${{ matrix.lane }}
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Linux Release (Core, strict)
            os: ubuntu-24.04
            configure_preset: ci-linux-release-strict
            test_preset: ci-linux-release-strict
            triplet: x64-linux-static
            # The two lanes that build what release.yml ships upload it.
            platform: linux-x86_64
          - lane: Linux Release (Core, no automation)
            os: ubuntu-24.04
            configure_preset: ci-linux-release-no-automation
            test_preset: ci-linux-release-no-automation
            triplet: x64-linux-static
          - lane: Linux ARM64 Release (Core, strict)
            os: ubuntu-24.04-arm
            configure_preset: ci-linux-arm64-release-strict
            test_preset: ci-linux-arm64-release-strict
            triplet: arm64-linux
            platform: linux-arm64
          - lane: Windows Release (Core, strict)
            os: windows-2025
            configure_preset: ci-windows-release-strict
            test_preset: ci-windows-release-strict
            triplet: x64-windows
          - lane: Windows Release (Core, no automation)
            os: windows-2025
            configure_preset: ci-windows-release-no-automation
            test_preset: ci-windows-release-no-automation
            triplet: x64-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2.6
        with:
          triplet: ${{ matrix.triplet }}

      - name: Configure
        run: cmake --preset "${{ matrix.configure_preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.configure_preset }}" --parallel

      - name: Validate runtime config contract
        if: runner.os == 'Linux' && matrix.configure_preset == 'ci-linux-release-strict'
        run: uv run python tests/contracts/runtime-config/validate-runtime-configs.py --runtime-bin build/ci-linux-release-strict/core/anolis-runtime

      - name: Validate machine profile contract
        if: runner.os == 'Linux' && matrix.configure_preset == 'ci-linux-release-strict'
        run: uv run python tests/contracts/machine-profile/validate-machine-profiles.py

      - name: Validate runtime HTTP OpenAPI contract (structural)
        if: runner.os == 'Linux' && matrix.configure_preset == 'ci-linux-release-strict'
        run: uv run python tests/contracts/runtime-http/validate-runtime-http-openapi.py

      - name: Validate runtime HTTP OpenAPI contract (examples)
        if: runner.os == 'Linux' && matrix.configure_preset == 'ci-linux-release-strict'
        run: uv run python tests/contracts/runtime-http/validate-runtime-http-examples.py

      - name: Run CTest
        run: ctest --preset "${{ matrix.test_preset }}"

      # An unreleased runtime to try on hardware before a tag: packed as
      # release.yml packs it, and named for the commit built. On a pull
      # request that is the merge of the head into the base.
      - name: Package runtime artifact
        id: package
        if: matrix.platform
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRESET: ${{ matrix.configure_preset }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          BUILT="$(git rev-parse --short=7 HEAD)"
          NAME="anolis-${BUILT}-${PLATFORM}"
          BINARY="build/${PRESET}/core/anolis-runtime"
          if [ ! -f "${BINARY}" ]; then
            echo "ERROR: binary not found at ${BINARY}" >&2
            exit 1
          fi
          mkdir -p staging/bin
          cp "${BINARY}" staging/bin/
          tar -czf "${NAME}.tar.gz" -C staging .
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "${NAME}.tar.gz: built from $(git rev-parse HEAD) (head ${HEAD_SHA})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime artifact
        if: matrix.platform
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  anolis-provider-compat:
    name: anolis-provider-compat
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout anolis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Resolve provider pin
        id: pins
        run: |
          set -euo pipefail
          PROVIDER_REPO=$(awk '/provider_sim:/{f=1; next} f && /repository:/{print $2; exit}' .ci/dependency-pins.yml)
          PROVIDER_REF=$(awk '/provider_sim:/{f=1; next} f && /ref:/{print $2; exit}' .ci/dependency-pins.yml)
          if [ -z "$PROVIDER_REPO" ] || [ -z "$PROVIDER_REF" ]; then
            echo "Failed to resolve provider pin from .ci/dependency-pins.yml" >&2
            exit 1
          fi
          echo "repo=$PROVIDER_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$PROVIDER_REF" >> "$GITHUB_OUTPUT"
          echo "Using provider pin: $PROVIDER_REPO@$PROVIDER_REF"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2.6
        with:
          triplet: x64-linux-static

      # The pin's release tarball rather than a source build: the release is
      # built with FluxGraph off for x64-linux-static, as the source build here
      # was, and checking it against the release's SHA256SUMS ties it to the tag.
      # The pin must therefore name a release tag.
      - name: Download pinned provider-sim release (FluxGraph OFF)
        id: provider
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_REPO: ${{ steps.pins.outputs.repo }}
          PROVIDER_REF: ${{ steps.pins.outputs.ref }}
        run: |
          set -euo pipefail
          DIR="$GITHUB_WORKSPACE/anolis-provider-sim"
          mkdir -p "$DIR"
          if ! gh release download "$PROVIDER_REF" -R "$PROVIDER_REPO" -D "$DIR" \
              --pattern '*-linux-x86_64.tar.gz' --pattern SHA256SUMS; then
            echo "::error::No release $PROVIDER_REF in $PROVIDER_REPO; the provider_sim pin in .ci/dependency-pins.yml must name a release tag" >&2
            exit 1
          fi
          (cd "$DIR" && sha256sum --check --ignore-missing --strict SHA256SUMS)
          tar -xzf "$DIR"/*-linux-x86_64.tar.gz -C "$DIR"
          EXE="$DIR/bin/anolis-provider-sim"
          if [ ! -x "$EXE" ]; then
            echo "Provider executable not found: $EXE" >&2
            exit 1
          fi
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: Configure compatibility preset
        run: |
          cmake --preset ci-linux-compat \
            -DANOLIS_ENABLE_PYTHON_CTEST=ON \
            -DPython3_EXECUTABLE="$(pwd)/.venv/bin/python" \
            -DANOLIS_PROVIDER_SIM_EXE="${{ steps.provider.outputs.exe }}"

      - name: Build compatibility preset
        run: cmake --build --preset ci-linux-compat --parallel

      - name: Validate runtime HTTP contract (live conformance smoke)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/ci-linux-compat/vcpkg_installed/x64-linux/lib
        run: |
          uv run python tests/contracts/runtime-http/validate-runtime-http-conformance.py \
            --runtime-bin build/ci-linux-compat/core/anolis-runtime \
            --provider-bin "${{ steps.provider.outputs.exe }}"

      - name: Run CTest compatibility entrypoint (Python)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/ci-linux-compat/vcpkg_installed/x64-linux/lib
        run: ctest --preset ci-linux-compat -L integration

  version-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: anolishq/.github/.github/workflows/version-sync.yml@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2
    with:
      python-version: '3.12'
      working-directory: '.'

  clang-tidy:
    name: Clang-Tidy (changed lines)
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    permissions:
      contents: read
    uses: anolishq/.github/.github/workflows/clang-tidy-diff.yml@0199b6cc7cb73a02d58f75ec8ed763ac40e54dca # clang-tidy-diff
    with:
      configure-preset: ci-linux-release
      blocking: true

  ok:
    name: ok
    if: always()
    needs:
      - changes
      - format-check
      - python-lint
      - python-typecheck
      - shell-tests
      - observability
      - ui-contracts
      - core-build-test
      - anolis-provider-compat
      - clang-tidy
      - version-sync
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
