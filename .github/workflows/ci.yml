name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cpp: ${{ steps.cppfilter.outputs.cpp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.svg'
              - '!**/*.jpg'
              - '!**/*.jpeg'
              - '!**/*.gif'
      # Separate OR-filter (default quantifier) for the C++ sources the clang-tidy
      # gate lints, so it skips (and the ok gate stays green) on non-C++ PRs.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: cppfilter
        with:
          filters: |
            cpp:
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '.clang-tidy'

  format-check:
    name: C++ Formatting (clang-format)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned clang-tools
        # SHA-verified static LLVM 18.1.8 clang-format on PATH — the org source of
        # truth; install the same pinned binary on dev boxes to match CI. See
        # anolishq/.github#69.
        uses: anolishq/.github/.github/actions/setup-clang-tools@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # setup-clang-tools
      - name: Check formatting
        run: git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs clang-format --dry-run --Werror

  python-lint:
    name: Python Linting (ruff)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff checks
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

  python-typecheck:
    name: Python Type Checking (mypy)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run mypy .

  shell-tests:
    name: Shell Lint & Smoke Tests (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # arm64 is the Pi deployment arch. arch_test.bats exercises install.sh's
        # uname -m mapping natively on each leg, so the arm64 leg proves the
        # aarch64->arm64 branch on real Pi-class hardware. See anolishq/.github#104.
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: ShellCheck
        # shellcheck is static analysis (arch-independent) — run it once, on x64.
        if: matrix.os == 'ubuntu-24.04'
        run: shellcheck tools/install.sh

      - name: BATS smoke tests
        run: bats tests/shell/

  ui-contracts:
    name: UI and Runtime Contracts
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Validate runtime HTTP OpenAPI contract (structural)
        run: uv run python tests/contracts/runtime-http/validate-runtime-http-openapi.py

      - name: Validate runtime HTTP OpenAPI contract (examples)
        run: uv run python tests/contracts/runtime-http/validate-runtime-http-examples.py

      - name: Validate machine profile contract
        run: uv run python tests/contracts/machine-profile/validate-machine-profiles.py

      - name: Validate telemetry timeseries contract
        run: uv run python tests/contracts/telemetry-timeseries/validate-telemetry-timeseries.py

      - name: Validate telemetry health timeseries contract
        run: uv run python tests/contracts/telemetry-timeseries/validate-telemetry-timeseries.py --manifest tests/contracts/telemetry-health-timeseries/examples/manifest.yaml

  core-build-test:
    name: ${{ matrix.lane }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Linux Release (Core, strict)
            os: ubuntu-24.04
            configure_preset: ci-linux-release-strict
            test_preset: ci-linux-release-strict
            triplet: x64-linux-static
          - lane: Linux Release (Core, no automation)
            os: ubuntu-24.04
            configure_preset: ci-linux-release-no-automation
            test_preset: ci-linux-release-no-automation
            triplet: x64-linux-static
          - lane: Linux ARM64 Release (Core, strict)
            os: ubuntu-24.04-arm
            configure_preset: ci-linux-arm64-release-strict
            test_preset: ci-linux-arm64-release-strict
            triplet: arm64-linux
          - lane: Windows Release (Core, strict)
            os: windows-2025
            configure_preset: ci-windows-release-strict
            test_preset: ci-windows-release-strict
            triplet: x64-windows
          - lane: Windows Release (Core, no automation)
            os: windows-2025
            configure_preset: ci-windows-release-no-automation
            test_preset: ci-windows-release-no-automation
            triplet: x64-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: ${{ matrix.triplet }}

      - name: Configure
        run: cmake --preset "${{ matrix.configure_preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.configure_preset }}" --parallel

      - name: Validate runtime config contract
        if: runner.os == 'Linux' && matrix.configure_preset == 'ci-linux-release-strict'
        run: uv run python tests/contracts/runtime-config/validate-runtime-configs.py --runtime-bin build/ci-linux-release-strict/core/anolis-runtime

      - name: Validate machine profile contract
        if: runner.os == 'Linux' && matrix.configure_preset == 'ci-linux-release-strict'
        run: uv run python tests/contracts/machine-profile/validate-machine-profiles.py

      - name: Validate runtime HTTP OpenAPI contract (structural)
        if: runner.os == 'Linux' && matrix.configure_preset == 'ci-linux-release-strict'
        run: uv run python tests/contracts/runtime-http/validate-runtime-http-openapi.py

      - name: Validate runtime HTTP OpenAPI contract (examples)
        if: runner.os == 'Linux' && matrix.configure_preset == 'ci-linux-release-strict'
        run: uv run python tests/contracts/runtime-http/validate-runtime-http-examples.py

      - name: Run CTest
        run: ctest --preset "${{ matrix.test_preset }}"

  anolis-provider-compat:
    name: anolis-provider-compat
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout anolis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Resolve provider pin
        id: pins
        run: |
          set -euo pipefail
          PROVIDER_REPO=$(awk '/provider_sim:/{f=1; next} f && /repository:/{print $2; exit}' .ci/dependency-pins.yml)
          PROVIDER_REF=$(awk '/provider_sim:/{f=1; next} f && /ref:/{print $2; exit}' .ci/dependency-pins.yml)
          if [ -z "$PROVIDER_REPO" ] || [ -z "$PROVIDER_REF" ]; then
            echo "Failed to resolve provider pin from .ci/dependency-pins.yml" >&2
            exit 1
          fi
          echo "repo=$PROVIDER_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$PROVIDER_REF" >> "$GITHUB_OUTPUT"
          echo "Using provider pin: $PROVIDER_REPO@$PROVIDER_REF"

      - name: Checkout pinned provider-sim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.pins.outputs.repo }}
          ref: ${{ steps.pins.outputs.ref }}
          path: anolis-provider-sim

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: x64-linux-static

      - name: Build pinned provider-sim (FluxGraph OFF)
        working-directory: anolis-provider-sim
        run: |
          cmake --preset ci-linux-release
          cmake --build --preset ci-linux-release --parallel

      - name: Resolve provider executable
        id: provider
        run: |
          set -euo pipefail
          EXE="$GITHUB_WORKSPACE/anolis-provider-sim/build/ci-linux-release/anolis-provider-sim"
          if [ ! -x "$EXE" ]; then
            echo "Provider executable not found: $EXE" >&2
            exit 1
          fi
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: Configure compatibility preset
        run: |
          cmake --preset ci-linux-compat \
            -DANOLIS_ENABLE_PYTHON_CTEST=ON \
            -DPython3_EXECUTABLE="$(pwd)/.venv/bin/python" \
            -DANOLIS_PROVIDER_SIM_EXE="${{ steps.provider.outputs.exe }}"

      - name: Build compatibility preset
        run: cmake --build --preset ci-linux-compat --parallel

      - name: Validate runtime HTTP contract (live conformance smoke)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/ci-linux-compat/vcpkg_installed/x64-linux/lib
        run: |
          uv run python tests/contracts/runtime-http/validate-runtime-http-conformance.py \
            --runtime-bin build/ci-linux-compat/core/anolis-runtime \
            --provider-bin "${{ steps.provider.outputs.exe }}"

      - name: Run CTest compatibility entrypoint (Python)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/ci-linux-compat/vcpkg_installed/x64-linux/lib
        run: ctest --preset ci-linux-compat -L integration

  version-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: anolishq/.github/.github/workflows/version-sync.yml@c76784aff711e6540d539f6a5c3ea33c63627930 # v2
    with:
      python-version: '3.12'
      working-directory: '.'

  clang-tidy:
    name: Clang-Tidy (changed lines)
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    permissions:
      contents: read
    uses: anolishq/.github/.github/workflows/clang-tidy-diff.yml@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # clang-tidy-diff
    with:
      configure-preset: ci-linux-release
      blocking: true

  ok:
    name: ok
    if: always()
    needs:
      - changes
      - format-check
      - python-lint
      - python-typecheck
      - shell-tests
      - ui-contracts
      - core-build-test
      - anolis-provider-compat
      - clang-tidy
      - version-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
