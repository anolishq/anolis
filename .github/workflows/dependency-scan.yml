name: Dependency Scan

# Weekly CVE scan of the vcpkg dependency set via the shared reusable workflow.
# Non-blocking; findings surface as a job summary + report artifact.
# See the epic: anolishq/.github#28.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: anolishq/.github/.github/workflows/dependency-scan.yml@82e7f70687b6b2b3cc8a9b047a397c73283b0428 # main
    with:
      triplet: x64-linux-static
    secrets:
      nvd_api_key: ${{ secrets.NVD_API_KEY }}
