name: Hardening

# Memory-safety hardening for anolis-runtime (TSAN lives in extended.yml).
#   - valgrind: shared org leak-check over `--check-config`.
#   - fuzz:     shared org libFuzzer runner over the YAML-config and ADPP-frame
#               decoders (bounded regression run against the checked-in corpus).
# Both fail only on a real first-party finding; third-party false positives are
# scoped in valgrind.supp (first run per change = triage pass).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tools/**"
      - "tests/shell/**"
      - "observability/**"
      - "tests/observability/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tools/**"
      - "tests/shell/**"
      - "observability/**"
      - "tests/observability/**"
  workflow_dispatch:

concurrency:
  group: anolis-hardening-${{ github.ref }}
  # Superseded pull request runs are cancelled; main runs are not (#504).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  valgrind:
    name: Valgrind leak-check
    uses: anolishq/.github/.github/workflows/valgrind-leak.yml@f4817837f29993c35b5350fbb5dfe2563437fcde # v2
    with:
      build-preset: ci-linux-release
      build-target: anolis-runtime
      run: "build/ci-linux-release/core/anolis-runtime --check-config tests/contracts/runtime-config/valid/01-minimal.yaml"
      suppressions: valgrind.supp

  fuzz:
    name: Fuzz (libFuzzer)
    uses: anolishq/.github/.github/workflows/fuzz.yml@f4817837f29993c35b5350fbb5dfe2563437fcde # v2
    with:
      build-preset: ci-fuzz
      fuzz-binaries: "build/ci-fuzz/fuzz/fuzz_config build/ci-fuzz/fuzz/fuzz_frame"
      corpus-root: fuzz/corpus
      max-total-time: "60"

  report-main-failure:
    # A lane that fails on main opens or updates a ci-main issue, so a
    # failure no pull request ran into is still reported (#504).
    name: Report a failure on main
    needs: [valgrind, fuzz]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts

      - name: Open or update the ci-main issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: .github/scripts/report-main-failure.sh
