# Anolis Runtime Configuration with Telemetry
# InfluxDB Telemetry enabled
#
# PREREQUISITES:
#   1. Start InfluxDB + Grafana:
#      cd observability && docker compose -f docker-compose.observability.yml up -d
#   2. Set INFLUXDB_TOKEN environment variable OR use token below
#
# DASHBOARDS:
#   - Open http://localhost:3001 (admin/anolis123)
#   - Navigate to Dashboards -> Signal History or Device Health

runtime:
  name: "anolis-telemetry"      # Instance identifier
  shutdown_timeout_ms: 2000     # Provider graceful shutdown timeout (500-30000ms)
  startup_timeout_ms: 30000     # Overall startup timeout (5000-300000ms)

http:
  enabled: true
  bind: 127.0.0.1
  port: 8080

providers:
  - id: sim0
    # provider-sim built with its presets, from a sibling checkout:
    #   Linux/macOS (dev-release): ../anolis-provider-sim/build/dev-release/anolis-provider-sim
    #   Linux/macOS (dev-debug):   ../anolis-provider-sim/build/dev-debug/anolis-provider-sim
    #   Windows (dev-windows-release): ../anolis-provider-sim/build/dev-windows-release/Release/anolis-provider-sim.exe
    #   Windows (dev-windows-debug):   ../anolis-provider-sim/build/dev-windows-debug/Debug/anolis-provider-sim.exe
    command: ../anolis-provider-sim/build/dev-release/anolis-provider-sim
    args: ["--config", "../anolis-provider-sim/config/provider-sim.yaml"]
    timeout_ms: 5000

polling:
  interval_ms: 500

telemetry:
  enabled: true
  influxdb:
    url: http://localhost:8086
    org: anolis
    bucket: anolis
    token: dev-token # Or set INFLUXDB_TOKEN env var
    batch_size: 100 # Flush batch when this size reached
    flush_interval_ms: 1000 # Flush every second

logging:
  level: info
