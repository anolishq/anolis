# Anolis Runtime Configuration
# HTTP Gateway + Basic provider config

runtime:
  name: "anolis-main"           # Optional: identify this runtime instance
  shutdown_timeout_ms: 2000     # Provider graceful shutdown timeout (500-30000ms)
  startup_timeout_ms: 30000     # Overall startup timeout (5000-300000ms)

http:
  enabled: true
  bind: 127.0.0.1
  port: 8080
  cors_allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  cors_allow_credentials: false
  # thread_pool_size: 40
  # Authentication — REQUIRED before exposing a non-loopback bind.
  # The runtime refuses to start on a non-loopback bind unless auth_enabled
  # (recommended) or allow_insecure_bind is set.
  # auth_enabled: false          # require a Bearer token on incoming requests
  # The shared secret comes from the ANOLIS_API_TOKEN env var (install.sh
  # generates one per device into /etc/anolis/runtime.env); keep it out of this file.
  # auth_exempt_loopback: false  # true skips auth for 127.0.0.1 / ::1: trusts every local process (docs/security.md)
  # allow_insecure_bind: false   # override the non-loopback-without-auth guard (NOT recommended)
  # TLS (HTTPS) — set both to serve over TLS; strongly recommended when auth is
  # used on a non-loopback bind (a Bearer token over plaintext is sniffable).
  # tls_cert_path: /etc/anolis/tls/cert.pem
  # tls_key_path: /etc/anolis/tls/key.pem

providers:
  - id: sim0
    # provider-sim built with its presets, from a sibling checkout:
    #   Linux/macOS (dev-release): ../anolis-provider-sim/build/dev-release/anolis-provider-sim
    #   Linux/macOS (dev-debug):   ../anolis-provider-sim/build/dev-debug/anolis-provider-sim
    #   Windows (dev-windows-release): ../anolis-provider-sim/build/dev-windows-release/Release/anolis-provider-sim.exe
    #   Windows (dev-windows-debug):   ../anolis-provider-sim/build/dev-windows-debug/Debug/anolis-provider-sim.exe
    command: ../anolis-provider-sim/build/dev-release/anolis-provider-sim
    args: ["--config", "../anolis-provider-sim/config/provider-sim.yaml"]
    timeout_ms: 5000
    # restart_policy:
    #   enabled: true
    #   max_attempts: 3
    #   backoff_ms: [200, 500, 1000]
    #   # timeout_ms: budget for one restart attempt; Hello and WaitReady share it.
    #   # Unset: hello_timeout_ms + ready_timeout_ms (65000ms with their defaults).

polling:
  interval_ms: 500 # Default polling interval (min 100ms)

telemetry:
  enabled: false
  # Uncomment and configure to enable InfluxDB telemetry:
  # influxdb:
  #   url: http://localhost:8086
  #   org: anolis
  #   bucket: anolis
  #   token: dev-token
  #   batch_size: 100
  #   flush_interval_ms: 1000

automation:
  enabled: false
  # Uncomment to enable behavior tree automation:
  # behavior_tree: ./tests/integration/fixtures/behaviors/demo.xml
  # tick_rate_hz: 10
