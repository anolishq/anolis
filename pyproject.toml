[project]
name = "anolis"
version = "0.0.0"
description = "Anolis runtime – Python test and validation tooling"
requires-python = ">=3.12"
# No runtime dependencies – this is a C++ project.
# Python is used only for testing and validation.
dependencies = []

[project.optional-dependencies]
dev = [
    "requests>=2.32.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "jsonschema>=4.22.0,<5.0.0",
    "ruff>=0.15.0,<1.0.0",
    "pytest>=9.0.3,<9.1.0",
    "pytest-timeout>=2.0.0,<3.0.0",
    "psutil>=5.9.0,<7.0.0",
    "protobuf>=5.29.5,<6.0.0",
    "mypy>=1.8.0,<2.0.0",
    "types-requests>=2.31.0",
    "types-psutil>=5.9.0",
    "types-PyYAML>=6.0.0",
    "types-jsonschema>=4.22.0",
]

[tool.uv]
# Not a distributable Python package – deps are for test tooling only.
package = false

# ---------------------------------------------------------------------------
# Tooling configuration for Ruff and pytest.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests/integration", "tests/scenarios"]
addopts = "--strict-markers -ra"
markers = [
  "integration: integration tests that run against runtime/provider processes",
  "scenario: operator-style scenario validation tests",
  "stress: high-load tests not required in default CI lane",
  "slow: long-running tests not required in default CI lane",
]
norecursedirs = ["tests_old", "build", ".venv", "vcpkg_installed"]
