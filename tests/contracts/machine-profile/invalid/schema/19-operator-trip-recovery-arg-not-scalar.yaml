schema_version: 1
machine_id: fixture-machine-operator-trip-recovery-arg-object
display_name: Fixture Machine With Operator Run

runtime_profiles:
  manual: runtime.manual.yml

providers:
  provider0:
    config: provider0.yml

behaviors:
  - behavior.xml

validation:
  expected_providers:
    - provider0

compatibility:
  runtime:
    config_contract: "01"
    http_contract: "02"
  providers:
    provider0:
      strategy: local-build
      version: local

operator:
  readings:
    - { signal: provider0/sensor0/ph_value, label: pH, decimals: 2 }
    - { signal: provider0/sensor0/temp_c, label: Temperature, unit: "°C", decimals: 1 }
  settings:
    - group: Stirring
      items:
        - { parameter: impeller_pwm, label: Speed }
    - group: Dose 1
      items:
        - { parameter: dose1_interval_s, label: Every, unit: s }
        - { parameter: dose1_pulse_s, label: For, unit: s }
  actions:
    - { label: Sample now, parameter: sample_requests }
  trip_recovery:
    - device: provider0/drive0
      after_clear:
        - label: Release
          function: set_brake
          args: { motor1_brake: { type: bool, bool: false } }
  run:
    label: Batch
    start: { enable: [impeller_enable, dose1_enable], mode: AUTO }
    stop: { disable: [impeller_enable, dose1_enable], mode: IDLE }
