    expect: valid
    note: health.excluded_signals leaves unused signals out of device health (#325)
  - file: tests/contracts/runtime-config/valid/11-health-excluded-signals-extra-key.yaml
    expect: valid
    note: an unknown key in a health.excluded_signals entry is warn-and-ignore
  - file: tests/contracts/runtime-config/valid/12-safety-on-startup-leave.yaml
    expect: valid
    note: safety.on_startup leave opts out of the startup safe state (#362)
  - file: tests/contracts/runtime-config/valid/13-safety-stop-chain-expect.yaml
    expect: valid
    note: safety.stop_chain devices as handles and as handle/expect mappings (#484)

