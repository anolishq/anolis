    expect: invalid/runtime
    note: two providers share the same id
  - file: tests/contracts/runtime-config/invalid/runtime/03-hooks-function-id-zero-without-name.yaml
    expect: invalid/runtime
    note: hook function id 0 requires a name but none is supplied
  - file: tests/contracts/runtime-config/invalid/runtime/04-safety-function-id-zero-without-name.yaml
    expect: invalid/runtime
    note: safety safe-state call function id 0 requires a name but none is supplied
  - file: tests/contracts/runtime-config/invalid/runtime/05-health-staleness-order.yaml
    expect: invalid/runtime
