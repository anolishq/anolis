    note: runtime_mode field is not permitted in config
  - file: tests/contracts/runtime-config/invalid/schema/02-automation-enabled-missing-behavior-tree.yaml
    expect: invalid/schema
    note: automation enabled but behavior_tree_path absent
  - file: tests/contracts/runtime-config/invalid/schema/03-cors-wildcard-credentials.yaml
    expect: invalid/schema
    note: CORS wildcard origin combined with credentials is forbidden
  - file: tests/contracts/runtime-config/invalid/schema/04-duplicate-keys-provider-command.yaml
    expect: invalid/schema
    note: duplicate mapping key in provider command block
  - file: tests/contracts/runtime-config/invalid/schema/05-negative-health-interval.yaml
    expect: invalid/schema
    note: telemetry.health_interval_ms must be >= 0
  - file: tests/contracts/runtime-config/invalid/schema/06-safety-call-missing-selector.yaml
    expect: invalid/schema
    note: safety safe-state call has device_handle but neither function_id nor function_name
  - file: tests/contracts/runtime-config/invalid/schema/07-negative-health-staleness.yaml
    expect: invalid/schema
    note: health.staleness.stale_after_ms must be >= 0
  - file: tests/contracts/runtime-config/invalid/schema/08-health-excluded-signals-bad-handle.yaml
    expect: invalid/schema
    note: health.excluded_signals device_handle must be provider_id/device_id
  - file: tests/contracts/runtime-config/invalid/schema/09-safety-on-startup-unknown.yaml
    expect: invalid/schema
    note: safety.on_startup must be safe_state or leave
  - file: tests/contracts/runtime-config/invalid/schema/10-safety-stop-chain-unknown-expect.yaml
    expect: invalid/schema
    note: safety.stop_chain device expect must be power_loss or reports_estop

