runtime:
  name: e2e-sim
  shutdown_timeout_ms: 2000
  startup_timeout_ms: 30000
http:
  enabled: true
  bind: 127.0.0.1
  port: 8080
providers:
- id: sim0
  command: ../anolis-provider-sim/build/dev-release/anolis-provider-sim
  args:
  - --config
  - ../anolis-projects/projects/e2e-sim/config/provider-sim.sim0.yaml
  timeout_ms: 5000
  hello_timeout_ms: 2000
  ready_timeout_ms: 10000
polling:
  interval_ms: 500
telemetry:
  enabled: false
logging:
  level: info
automation:
  enabled: false
# The startup safe state drives every actuating function to zero, so the walk
# can check that it ran and was achieved.
safety:
  safe_state:
    zero_is_safe: true
