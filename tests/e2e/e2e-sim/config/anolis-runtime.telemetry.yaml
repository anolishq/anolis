runtime:
  name: e2e-sim
  shutdown_timeout_ms: 2000
  startup_timeout_ms: 30000
http:
  enabled: true
  bind: 127.0.0.1
  port: 8080
providers:
- id: sim0
  command: ../anolis-provider-sim/build/dev-release/anolis-provider-sim
  args:
  - --config
  - ../anolis-projects/projects/e2e-sim/config/provider-sim.sim0.yaml
  timeout_ms: 5000
  hello_timeout_ms: 2000
  ready_timeout_ms: 10000
polling:
  interval_ms: 500
telemetry:
  enabled: true
  # Token via INFLUXDB_TOKEN (/etc/anolis/runtime.env), which install.sh wires.
  influxdb:
    url: http://localhost:8086
    org: anolis
    bucket: anolis
    batch_size: 100
    flush_interval_ms: 1000
logging:
  level: info
automation:
  enabled: false
# The startup safe state turns every simulated actuator off, so the walk can
# check that it ran and was achieved. zero_is_safe can't: the sim's motor and
# relay indexes start at 1, its relay states are booleans, and chaos_control's
# functions take a device id.
safety:
  safe_state:
    hooks:
      - device_handle: sim0/motorctl0
        function_name: set_motor_duty
        args:
          motor_index: 1
          duty: 0.0
      - device_handle: sim0/motorctl0
        function_name: set_motor_duty
        args:
          motor_index: 2
          duty: 0.0
      - device_handle: sim0/relayio0
        function_name: set_relay_ch1
        args:
          enabled: false
      - device_handle: sim0/relayio0
        function_name: set_relay_ch2
        args:
          enabled: false
      - device_handle: sim0/relayio0
        function_name: set_relay_ch3
        args:
          enabled: false
      - device_handle: sim0/relayio0
        function_name: set_relay_ch4
        args:
          enabled: false
      - device_handle: sim0/tempctl0
        function_name: set_relay
        args:
          relay_index: 1
          state: false
      - device_handle: sim0/tempctl0
        function_name: set_relay
        args:
          relay_index: 2
          state: false
