\* #528: a concurrent change made the FAULT refuse. Needs #763 undone too, which otherwise makes this race unreachable.
INIT Init
NEXT Next
CONSTANT Ops = {o1, o2}
CONSTANT HookAt = "before"
INVARIANT TypeOK
INVARIANT SafeWhenSettledOutsideAuto
INVARIANT FaultAlwaysCommits
INVARIANT NoAutoWhenHookless
INVARIANT NoAutoEntryWhileLatched
INVARIANT SafeWhileStopHolds
CONSTANT OrdinaryMayCommit <- OrdinaryIgnoresFault
CONSTANT FaultMayCommit <- FaultRefusesConcurrent
