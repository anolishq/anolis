\* #774: a fix that counts only a FAULT request made in FAULT. A real FAULT that commits between two recoveries is then lost.
INIT Init
NEXT Next
CONSTANT Ops = {o1, o2}
CONSTANT HookAt = "before"
INVARIANT TypeOK
INVARIANT SafeWhenSettledOutsideAuto
INVARIANT FaultAlwaysCommits
INVARIANT NoAutoWhenHookless
INVARIANT NoAutoEntryWhileLatched
INVARIANT SafeWhileStopHolds
CONSTANT MarkOnFaultRequest <- MarkOnFaultRequestNotCounted
