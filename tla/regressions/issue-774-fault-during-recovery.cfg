\* #774: a FAULT requested in FAULT during a recovery was a no-op, and the recovery then committed.
INIT Init
NEXT Next
CONSTANT Ops = {o1, o2}
CONSTANT HookAt = "before"
INVARIANT TypeOK
INVARIANT SafeWhenSettledOutsideAuto
INVARIANT FaultAlwaysCommits
INVARIANT NoAutoWhenHookless
INVARIANT NoAutoEntryWhileLatched
INVARIANT SafeWhileStopHolds
CONSTANT RecoveryMayCommit <- RecoveryIgnoresFault
