\* #776: IDLE committed before an after-hook leaving AUTO ran, and the IDLE gate refused its call.
INIT Init
NEXT Next
CONSTANT Ops = {o1, o2}
CONSTANT HookAt = "after"
INVARIANT TypeOK
INVARIANT SafeWhenSettledOutsideAuto
INVARIANT FaultAlwaysCommits
INVARIANT NoAutoWhenHookless
INVARIANT NoAutoEntryWhileLatched
INVARIANT SafeWhileStopHolds
CONSTANT IdleMayStart <- IdleIgnoresAfterHooks
