\* #776: IDLE held back at the request only. The mode can go MANUAL -> AUTO -> MANUAL while the request's before-hooks run.
INIT Init
NEXT Next
CONSTANT Ops = {o1, o2}
CONSTANT HookAt = "after"
INVARIANT TypeOK
INVARIANT SafeWhenSettledOutsideAuto
INVARIANT FaultAlwaysCommits
INVARIANT NoAutoWhenHookless
INVARIANT NoAutoEntryWhileLatched
INVARIANT SafeWhileStopHolds
CONSTANT IdleMayCommit <- IdleIgnoresAfterHooks
