# Signals to be read and not acted on: what the RFC's first version is for.
# A graph of two providers, at the period the runtime polls at.
#
#   a      a noisy voltage of the first simulator
#   b      the same channel of the second
#
#   apart  how far apart the two are: a signal of two providers
#   smooth a low-pass of a, that rides through 2 s without it
#   quiet  smooth, held until it has moved by 0.01
#   mean   the mean of a over 10 s
#   far    whether they are more than 0.05 apart
period: 500ms
inputs:
  a: {max_age: 2s}
  b: {max_age: 2s}
blocks:
  - id: d
    type: formula
    in: {a: a, b: b}
    settings: {expr: "a - b"}
    out: {y: apart}
  - id: f
    type: lowpass
    in: {x: a}
    settings: {tau: 5s, settle: 5s, ride_through: 2s}
    out: {y: smooth}
  - id: q
    type: deadband
    in: {x: f.y}
    settings: {step: 0.01}
    out: {y: quiet}
  - id: w
    type: window
    in: {x: a}
    settings: {window: 10s, min_good: 0.8}
    out: {mean: mean}
  - id: g
    type: formula
    in: {d: d.y}
    settings: {expr: "abs(d) > 0.05"}
    out: {y: far}
